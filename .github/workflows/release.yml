name: release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: build-${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-latest
          - os: linux
            arch: arm64
            runner: ubuntu-22.04-arm
          - os: darwin
            arch: arm64
            runner: macos-latest
          - os: darwin
            arch: amd64
            runner: macos-26-intel
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          case "${{ matrix.os }}" in
            linux) sudo apt-get update && sudo apt-get install -y libreadline-dev ;;
            darwin) brew install readline ;;
          esac

      - name: Configure
        run: cmake -B build -S . -DKASH_STATIC_READLINE=ON

      - name: Build
        run: cmake --build build

      - name: Package tarball
        run: |
          mkdir -p dist/pkg
          cp build/kash dist/pkg/kash
          cp LICENSE dist/pkg/LICENSE
          cp README.md dist/pkg/README.md
          tar -C dist/pkg -czf dist/kash-${{ matrix.os }}-${{ matrix.arch }}.tar.gz .

      - uses: actions/upload-artifact@v4
        with:
          name: kash-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/kash-${{ matrix.os }}-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Configure git
        run: |
          git config user.name "semantic-release-bot"
          git config user.email "semantic-release-bot@users.noreply.github.com"

      - name: Install semantic-release
        run: |
          npm install --global \
            semantic-release@25 \
            @semantic-release/exec@7 \
            @semantic-release/git@11 \
            @semantic-release/github@12\
            conventional-changelog-conventionalcommits@10

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: semantic-release
